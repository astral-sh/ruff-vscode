name: Release
on:
  workflow_dispatch:
  release:
    types: [published]

env:
  FETCH_DEPTH: 0
  UV_VERSION: 0.12.5

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Phase 1: Generate the Build ID.
  # We have to do this ahead-of-time, and store it as a job output,
  # to ensure that we use the same Build ID across all build jobs.
  build-id:
    name: "Build ID"
    runs-on: ubuntu-latest
    outputs:
      RELEASE_BUILD_ID: ${{ steps.release-build-id-generator.outputs.BUILD_ID }}
      NIGHTLY_BUILD_ID: ${{ steps.nightly-build-id-generator.outputs.BUILD_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Generate Build ID (release)
        if: "startsWith(github.ref, 'refs/tags/')"
        id: release-build-id-generator
        run: |
          export BUILD_ID=$(python -m build.generate_build_id)
          echo "BUILD_ID: ${BUILD_ID}"
          echo "BUILD_ID=${BUILD_ID}" >> $GITHUB_OUTPUT
      - name: Generate Build ID (nightly)
        if: "!startsWith(github.ref, 'refs/tags/')"
        id: nightly-build-id-generator
        run: |
          export BUILD_ID=$(python -m build.generate_build_id --pre-release)
          echo "BUILD_ID: ${BUILD_ID}"
          echo "BUILD_ID=${BUILD_ID}" >> $GITHUB_OUTPUT

  # Phase 2: Build the extension on all platforms.
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            code-target: win32-x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            code-target: win32-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            code-target: linux-x64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            code-target: linux-arm64
          - os: ubuntu-22.04
            target: arm-unknown-linux-gnueabihf
            code-target: linux-armhf
            arch: armv7
          - os: macos-latest
            target: x86_64-apple-darwin
            code-target: darwin-x64
          - os: macos-14
            target: aarch64-apple-darwin
            code-target: darwin-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            code-target: alpine-x64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            code-target: alpine-arm64

    name: Build (${{ matrix.target }})
    needs: ["build-id"]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false

      # Install Python dependencies (including Ruff's native binary).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          version: ${{ env.UV_VERSION }}

      # uv does not currently expose ARMv7 as a cross-platform install target.
      - uses: uraimo/run-on-arch-action@f9b26e3a1a408d5fd530d20c17b9f3f4428ff8d9 # v3.1.0
        if: ${{ matrix.target == 'arm-unknown-linux-gnueabihf' }}
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu20.04
          install: |
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl python3
            cd /tmp
            curl --fail --location --remote-name --silent --show-error "https://github.com/astral-sh/uv/releases/download/${{ env.UV_VERSION }}/uv-armv7-unknown-linux-gnueabihf.tar.gz"
            curl --fail --location --remote-name --silent --show-error "https://github.com/astral-sh/uv/releases/download/${{ env.UV_VERSION }}/uv-armv7-unknown-linux-gnueabihf.tar.gz.sha256"
            sha256sum --check uv-armv7-unknown-linux-gnueabihf.tar.gz.sha256
            tar --extract --file uv-armv7-unknown-linux-gnueabihf.tar.gz --gzip --strip-components 1 --directory /usr/local/bin uv-armv7-unknown-linux-gnueabihf/uv
          run: |
            uv export --locked --no-dev --no-emit-project |
              uv pip sync --no-config --require-hashes --no-build \
                --python-version 3.8.20 \
                --target ./bundled/libs -

      - name: Install Python dependencies
        if: ${{ matrix.target != 'arm-unknown-linux-gnueabihf' }}
        run: |
          uv export --locked --no-dev --no-emit-project |
            uv pip sync --no-config --require-hashes --no-build \
              --python-version 3.8.20 \
              --python-platform "${{ matrix.target }}" \
              --target ./bundled/libs -

      # Install Node.
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      # Install Node dependencies.
      - run: npm ci --ignore-scripts

      # Set the Build ID.
      - name: Set Build ID (release)
        if: "startsWith(github.ref, 'refs/tags/')"
        run: |
          python -m build.update_ext_version --build-id "${RELEASE_BUILD_ID}" --for-publishing
        env:
          RELEASE_BUILD_ID: ${{ needs.build-id.outputs.RELEASE_BUILD_ID }}
      - name: Set Build ID (nightly)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          python -m build.update_ext_version --build-id "${NIGHTLY_BUILD_ID}" --for-publishing --pre-release
        env:
          NIGHTLY_BUILD_ID: ${{ needs.build-id.outputs.NIGHTLY_BUILD_ID }}

      # Build the extension.
      - name: Package Extension (release)
        if: "startsWith(github.ref, 'refs/tags/')"
        run: ./node_modules/.bin/vsce package -o "./dist/ruff-${{ matrix.code-target }}.vsix" --target ${{ matrix.code-target }}
      - name: Package Extension (nightly)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: ./node_modules/.bin/vsce package -o "./dist/ruff-${{ matrix.code-target }}.vsix" --target ${{ matrix.code-target }} --pre-release

      # Upload the extension.
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: ./dist

  # Phase 3: Publish the built extension to the Marketplace.
  publish-code-marketplace:
    name: "Publish (Code Marketplace)"
    needs: ["build"]
    runs-on: ubuntu-latest
    steps:
      - name: Install Nodejs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false

      # Download all built artifacts.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-aarch64-apple-darwin
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-apple-darwin
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-aarch64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-arm-unknown-linux-gnueabihf
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-pc-windows-msvc
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-aarch64-pc-windows-msvc
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-unknown-linux-musl
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-aarch64-unknown-linux-musl
          path: dist
      - run: ls -al ./dist

      # Install Node dependencies.
      - run: npm ci --ignore-scripts

      # Publish to the Code Marketplace.
      - name: Publish Extension (Code Marketplace, release)
        if: "startsWith(github.ref, 'refs/tags/')"
        run: ./node_modules/.bin/vsce publish --pat ${{ secrets.MARKETPLACE_TOKEN }} --packagePath ./dist/ruff-*.vsix --skip-duplicate
      - name: Publish Extension (Code Marketplace, nightly)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: ./node_modules/.bin/vsce publish --pat ${{ secrets.MARKETPLACE_TOKEN }} --packagePath ./dist/ruff-*.vsix --pre-release --skip-duplicate

  publish-openvsx:
    name: "Publish (OpenVSX)"
    needs: ["build"]
    runs-on: ubuntu-latest
    steps:
      - name: Install Nodejs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false

      # Download all built artifacts.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-aarch64-apple-darwin
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-apple-darwin
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-aarch64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-arm-unknown-linux-gnueabihf
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-pc-windows-msvc
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-aarch64-pc-windows-msvc
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-unknown-linux-musl
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-aarch64-unknown-linux-musl
          path: dist
      - run: ls -al ./dist

      # Install Node dependencies.
      - run: npm ci --ignore-scripts

      # Publish to OpenVSX.
      - name: Publish Extension (OpenVSX, release)
        if: "startsWith(github.ref, 'refs/tags/')"
        run: ./node_modules/.bin/ovsx publish --pat ${{ secrets.OPENVSX_TOKEN }} --packagePath ./dist/ruff-*.vsix --skip-duplicate
        timeout-minutes: 2
      - name: Publish Extension (OpenVSX, nightly)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: ./node_modules/.bin/ovsx publish --pat ${{ secrets.OPENVSX_TOKEN }} --packagePath ./dist/ruff-*.vsix --pre-release --skip-duplicate
        timeout-minutes: 2
