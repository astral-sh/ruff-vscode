name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

env:
  UV_NO_BUILD: "1"

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.9"
          checksum: "a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5"
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          package-manager-cache: false
      - name: Install development dependencies
        run: uv sync --dev
      - name: Install bundled Ruff
        env:
          PR_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
        run: |
          sync=(uv pip sync --require-hashes ./requirements.txt --target ./bundled/libs)
          "${sync[@]}" && exit 0

          # Match branches created by Prepare release or release.py --prepare-pr.
          release_branch='^release(/auto/|/|-)[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ "$PR_REPOSITORY_ID" != "$GITHUB_REPOSITORY_ID" || ! "$GITHUB_HEAD_REF" =~ $release_branch ]]; then
            exit 1
          fi

          # This runner may see a cached PyPI listing for ten minutes after a release.
          for delay in 10 20 40 60 90 120 120 180; do
            echo "uv pip sync failed. Retrying in $delay seconds."
            sleep "$delay"
            "${sync[@]}" --refresh-package ruff && exit 0
          done
          exit 1
      - name: Install npm dependencies
        run: npm ci --ignore-scripts
      - name: Run checks
        run: npm run check

