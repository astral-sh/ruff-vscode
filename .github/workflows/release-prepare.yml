name: Prepare release

on:
  workflow_dispatch:
    inputs:
      ruff-version:
        description: Bundled Ruff version (defaults to the latest version on PyPI)
        required: false
        type: string
      version:
        description: Extension version without a leading v (optional override)
        required: false
        type: string
      auto-promote:
        description: Merge after required checks and start Release (upstream releases bot only)
        type: boolean
        default: false

concurrency:
  group: release-prepare
  queue: max
  cancel-in-progress: false

permissions: {}

env:
  UV_NO_BUILD: "1"

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare release PR
    environment: prepare
    # On reruns, actor_id still identifies the original dispatcher (astral-releases-bot[bot] for auto-promotion).
    if: >-
      github.repository == 'astral-sh/ruff-vscode' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (!inputs.auto-promote || github.actor_id == '328004183')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Exchange for the release PR token.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.8"
          checksum: "5acfd9177cfecf0bf87578f059728215ccc884388988f55f7a65041b57387d91"
          python-version: "3.13"

      - name: Select extension version
        id: plan
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}
          VERSION: ${{ inputs.version }}
        run: |
          uv run --locked scripts/release.py --plan-version "$VERSION" "$RUFF_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release PR
        if: steps.plan.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUTO_PROMOTE: ${{ inputs.auto-promote }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          prs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" --paginate \
            -f state=open -f base="$DEFAULT_BRANCH" -F per_page=100 \
            --jq '.[] | select(.head.repo.id == .base.repo.id) | [.head.ref, .html_url] | @tsv')
          while IFS=$'\t' read -r head url; do
            if [[ "$head" == "release/auto/$VERSION-"* ||
                  ( "$AUTO_PROMOTE" == true && ( "$head" == release/auto/* || "$head" == "release/$VERSION" ) ) ]]; then
              echo "::error::A release PR is already open: $url"
              exit 1
            fi
          done <<< "$prs"

      - name: Verify protection for the automated release branch
        id: auto-branch
        if: steps.plan.outputs.version != '' && inputs.auto-promote
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          branch="release/auto/$VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          # Auto-merge can survive an update by someone with write access.
          locked=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/${branch//\//%2F}" \
            --jq 'any(.[]; .type == "update" and (.parameters.update_allows_fetch_and_merge != true))')
          if [[ "$locked" != true ]]; then
            echo "::error::Configure the Restrict updates ruleset for release/auto/* before enabling auto-promotion."
            exit 1
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Bump version and refresh lockfiles
        if: steps.plan.outputs.version != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          RUFF_VERSION: ${{ inputs.ruff-version }}
        run: |
          args=(--new-version "$VERSION")
          if [[ -n "$RUFF_VERSION" ]]; then
            args+=(--new-ruff "$RUFF_VERSION")
          fi
          uv run --locked scripts/release.py "${args[@]}"
          uv run --locked scripts/release.py --validate "$VERSION"

      - name: Get release PR token
        id: token
        if: steps.plan.outputs.version != ''
        uses: astral-sh/github-actions/simple-token-service@eb81cf4d13127c3f9539f621c17e4c65327636c8
        with:
          exchange-url: ${{ secrets.RELEASES_STS_API_URL }}/exchange
          audience: ${{ secrets.RELEASES_STS_API_URL }}
          repository: astral-sh/ruff-vscode
          permissions: |
            contents: write
            pull_requests: write

      - name: Create manual release PR
        if: steps.plan.outputs.version != '' && inputs.auto-promote == false
        uses: astral-sh/github-actions/create-release-pr@67dc9ee1ddc113eccd8116e7b949fb6cdcd89889 # 2026.11.16.0
        with:
          version: ${{ steps.plan.outputs.version }}
          token: ${{ steps.token.outputs.token }}

      - name: Open automated release PR
        id: auto-pr
        if: steps.auto-branch.outputs.name != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: ${{ steps.auto-branch.outputs.name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git diff --check HEAD
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --all --message "Release $VERSION"

          gh auth setup-git --hostname github.com
          ref="refs/heads/$BRANCH"
          prepared_sha=$(git rev-parse HEAD)
          # An empty lease requires the branch to be new.
          git push --force-with-lease="$ref:" origin "$prepared_sha:$ref"

          pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$DEFAULT_BRANCH" \
            --head "$BRANCH" --title "Release $VERSION" \
            --body "Prepared by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.")
          printf 'url=%s\nsha=%s\n' "$pr_url" "$prepared_sha" >> "$GITHUB_OUTPUT"
          printf 'Automated release PR %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Enable auto-merge
        if: steps.auto-pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ steps.auto-pr.outputs.url }}
          PREPARED_SHA: ${{ steps.auto-pr.outputs.sha }}
        run: gh pr merge "$PR_URL" --squash --auto --match-head-commit "${PREPARED_SHA:?Missing prepared head SHA}"
