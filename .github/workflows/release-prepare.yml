# Bump the extension and bundled Ruff versions and create a pull request.
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact extension version to release, without a leading v
        required: true
        type: string
      ruff-version:
        description: Bundled Ruff version (defaults to the latest version on PyPI)
        required: false
        type: string

permissions: {}

jobs:
  prepare:
    name: Prepare release
    if: github.repository == 'astral-sh/ruff-vscode' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.12.23"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          python-version: "3.13"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          package-manager-cache: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid extension version: ${VERSION}"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} already exists"
            exit 1
          fi

          args=(--new-version "$VERSION")
          if [[ -n "$RUFF_VERSION" ]]; then
            args+=(--new-ruff "$RUFF_VERSION")
          fi
          uv run --locked scripts/release.py "${args[@]}"

          package_version="$(node -p 'require("./package.json").version')"
          if [[ "$package_version" != "$VERSION" ]]; then
            echo "::error::Requested version ${VERSION} was normalized to ${package_version}"
            exit 1
          fi
        env:
          VERSION: ${{ inputs.version }}
          RUFF_VERSION: ${{ inputs.ruff-version }}

      - name: Create or update pull request
        run: |
          branch="release/${VERSION}"
          git switch -c "$branch"
          git add package.json package-lock.json pyproject.toml uv.lock requirements.txt README.md CHANGELOG.md
          git commit -m "Release ${VERSION}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"

          pull_request="$(
            gh pr list \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --state open \
              --json url \
              --jq '.[0].url'
          )"
          if [ -n "$pull_request" ]; then
            printf '%s\n' "$pull_request"
          else
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --fill-first
          fi
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
