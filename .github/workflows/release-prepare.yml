name: Prepare release

on:
  workflow_dispatch:
    inputs:
      ruff-version:
        description: Bundled Ruff version (defaults to the latest version on PyPI)
        required: false
        type: string
      version:
        description: Extension version without a leading v (optional override)
        required: false
        type: string
      auto-promote:
        description: Auto-promote (merge after CI and start Release)
        type: boolean
        default: false

concurrency:
  group: release-prepare
  queue: max
  cancel-in-progress: false

permissions: {}

env:
  UV_NO_BUILD: "1"

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare release PR
    environment: prepare
    if: github.repository == 'astral-sh/ruff-vscode' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # Read CI results.
      id-token: write # Exchange for the release PR token.
    outputs:
      version: ${{ steps.bump-files.outputs.version || steps.bump.outputs.version }}
      merge-sha: ${{ steps.merge.outputs.sha || steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.7"
          checksum: "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83"
          python-version: "3.13"

      - name: Select extension version
        id: bump
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$RUFF_VERSION" && -z "$VERSION" ]]; then
            uv run --locked scripts/release.py --plan-upstream "$RUFF_VERSION" >> "$GITHUB_OUTPUT"
          else
            if [[ -n "$VERSION" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Enter an exact extension version to prepare a release PR."
              exit 1
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "prepare=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and refresh lockfiles
        id: bump-files
        if: steps.bump.outputs.prepare == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          RUFF_VERSION: ${{ inputs.ruff-version }}
        run: |
          args=()
          if [[ -n "$VERSION" ]]; then
            args+=(--new-version "$VERSION")
          fi
          if [[ -n "$RUFF_VERSION" ]]; then
            args+=(--new-ruff "$RUFF_VERSION")
          fi
          uv run --locked scripts/release.py "${args[@]}"
          version=$(uv run --locked --only-group jaq jaq -er '.version' package.json)
          uv run --locked scripts/release.py --validate "${VERSION:-$version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Get release PR token
        id: token
        if: steps.bump.outputs.prepare == 'true'
        uses: astral-sh/github-actions/simple-token-service@eb81cf4d13127c3f9539f621c17e4c65327636c8
        with:
          exchange-url: ${{ secrets.RELEASES_STS_API_URL }}/exchange
          audience: ${{ secrets.RELEASES_STS_API_URL }}
          repository: astral-sh/ruff-vscode
          permissions: |
            contents: write
            pull_requests: write

      - name: Create release PR
        id: pr
        if: steps.bump.outputs.prepare == 'true'
        uses: astral-sh/github-actions/create-release-pr@b18ab2e0c11d16711c1818c8774babfa0203b909 # 2026.10.08.0
        with:
          version: ${{ steps.bump-files.outputs.version }}
          token: ${{ steps.token.outputs.token }}

      - name: Wait for CI on the prepared commit
        if: steps.bump.outputs.prepare == 'true' && inputs.auto-promote
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(git rev-parse HEAD)
          for workflow in ci.yml zizmor.yml; do
            endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs"
            while true; do
              state=$(gh api "$endpoint?head_sha=$head_sha&event=pull_request&per_page=1" \
                --jq '.workflow_runs[0] | .conclusion // .status // "waiting"')
              case "$state" in
                success) break ;;
                waiting|requested|queued|in_progress|pending) sleep 10 ;;
                *) echo "::error::$workflow finished with $state"; exit 1 ;;
              esac
            done
          done

      - name: Merge the tested commit
        id: merge
        if: steps.bump.outputs.prepare == 'true' && inputs.auto-promote
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          pr_number=${PR_URL##*/}
          sha=$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$pr_number/merge" \
            -f merge_method=squash -f sha="$(git rev-parse HEAD)" --jq 'select(.merged) | .sha')
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  dispatch-release:
    name: Dispatch release
    needs: prepare
    if: inputs.auto-promote && needs.prepare.outputs.merge-sha != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MERGE_SHA: ${{ needs.prepare.outputs.merge-sha }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f version="$VERSION" -f expected-sha="$MERGE_SHA"
