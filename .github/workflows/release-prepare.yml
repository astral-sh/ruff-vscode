name: Prepare release

on:
  workflow_dispatch:
    inputs:
      ruff-version:
        description: Bundled Ruff version (defaults to the latest version on PyPI)
        required: false
        type: string
      version:
        description: Extension version without a leading v (optional override)
        required: false
        type: string
      auto-promote:
        description: Auto-promote (upstream releases bot only)
        type: boolean
        default: false

concurrency:
  group: release-prepare
  queue: max
  cancel-in-progress: false

permissions: {}

env:
  UV_NO_BUILD: "1"

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare release PR
    environment: prepare
    # On reruns, actor_id still identifies the original dispatcher (astral-releases-bot[bot] for auto-promotion).
    if: >-
      github.repository == 'astral-sh/ruff-vscode' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (!inputs.auto-promote || github.actor_id == '328004183')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write # Exchange for the release PR token.
      pull-requests: read
      statuses: read
    outputs:
      merge-sha: ${{ steps.merge.outputs.sha }}
      version: ${{ steps.bump-files.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.7"
          checksum: "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83"
          python-version: "3.13"

      - name: Select extension version
        id: bump
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$RUFF_VERSION" && -z "$VERSION" ]]; then
            uv run --locked scripts/release.py --plan-upstream "$RUFF_VERSION" >> "$GITHUB_OUTPUT"
          else
            if [[ -n "$VERSION" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Enter an exact extension version to prepare a release PR."
              exit 1
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "prepare=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and refresh lockfiles
        id: bump-files
        if: steps.bump.outputs.prepare == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          RUFF_VERSION: ${{ inputs.ruff-version }}
        run: |
          args=()
          if [[ -n "$VERSION" ]]; then
            args+=(--new-version "$VERSION")
          fi
          if [[ -n "$RUFF_VERSION" ]]; then
            args+=(--new-ruff "$RUFF_VERSION")
          fi
          uv run --locked scripts/release.py "${args[@]}"
          version=$(uv run --locked --only-group jaq jaq -er '.version' package.json)
          uv run --locked scripts/release.py --validate "${VERSION:-$version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Get release PR token
        id: token
        if: steps.bump.outputs.prepare == 'true'
        uses: astral-sh/github-actions/simple-token-service@eb81cf4d13127c3f9539f621c17e4c65327636c8
        with:
          exchange-url: ${{ secrets.RELEASES_STS_API_URL }}/exchange
          audience: ${{ secrets.RELEASES_STS_API_URL }}
          repository: astral-sh/ruff-vscode
          permissions: |
            contents: write
            pull_requests: write

      - name: Create release PR
        id: pr
        if: steps.bump.outputs.prepare == 'true'
        uses: astral-sh/github-actions/create-release-pr@b18ab2e0c11d16711c1818c8774babfa0203b909 # 2026.10.08.0
        with:
          version: ${{ steps.bump-files.outputs.version }}
          token: ${{ steps.token.outputs.token }}

      - name: Watch required checks on the prepared PR
        id: checks
        if: steps.bump.outputs.prepare == 'true' && inputs.auto-promote
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          prepared_sha=$(git rev-parse HEAD)
          verify_pr() {
            local pr state base head
            pr=$(gh pr view "$PR_URL" --json state,baseRefName,headRefOid \
              --jq '[.state, .baseRefName, .headRefOid] | @tsv')
            IFS=$'\t' read -r state base head <<< "$pr"
            if [[ "$state" != OPEN || "$base" != "$DEFAULT_BRANCH" || "$head" != "$prepared_sha" ]]; then
              echo "::error::Expected an open PR into $DEFAULT_BRANCH at $prepared_sha, found $state into $base at $head."
              exit 1
            fi
          }
          verify_pr
          # gh exits before watching if GitHub hasn't reported any required checks yet.
          errors="$RUNNER_TEMP/pr-checks.err"
          for attempt in {1..12}; do
            if gh pr checks "$PR_URL" --watch --required 2>"$errors"; then
              break
            fi
            cat "$errors" >&2
            if [[ "$attempt" == 12 ]] || ! grep -Eq '^no (required )?checks reported on ' "$errors"; then
              exit 1
            fi
            sleep 5
          done
          verify_pr
          echo "head-sha=$prepared_sha" >> "$GITHUB_OUTPUT"

      - name: Squash-merge the prepared commit
        id: merge
        if: steps.bump.outputs.prepare == 'true' && inputs.auto-promote
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          PREPARED_SHA: ${{ steps.checks.outputs.head-sha }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/pulls/${PR_URL##*/}"
          sha=$(gh api --method PUT "$endpoint/merge" -f merge_method=squash -f sha="${PREPARED_SHA:?Missing prepared head SHA}" \
            --jq 'select(.merged) | .sha // empty')
          if [[ -z "$sha" ]]; then
            echo "::error::GitHub did not return a merge commit SHA."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  dispatch-release:
    name: Dispatch release
    needs: prepare
    if: inputs.auto-promote && needs.prepare.outputs.merge-sha != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the publisher for the squash commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MERGE_SHA: ${{ needs.prepare.outputs.merge-sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f version="$VERSION" -f expected-sha="$MERGE_SHA"
