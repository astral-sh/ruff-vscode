# Validate and publish a release, then create its tag and GitHub release.
name: Release
on:
  workflow_dispatch:
    inputs:
      release-pr:
        description: Merged automated release PR to publish (optional)
        required: false
        type: string
      version:
        description: Extension version without a leading v (defaults to package.json)
        required: false
        type: string
      expected-sha:
        description: Require the default branch to point to this commit at dispatch (optional)
        required: false
        type: string

concurrency:
  group: release
  queue: max
  cancel-in-progress: false

env:
  FETCH_DEPTH: 0

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Phase 1: Validate the release and generate the Build ID.
  # We have to do this ahead-of-time, and store it as a job output,
  # to ensure that we use the same Build ID across all build jobs.
  validate-release:
    name: Validate release
    # The merge listener dispatches as github-actions[bot] (account ID 41898282).
    if: >-
      github.repository == 'astral-sh/ruff-vscode' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      ((github.event.sender.type == 'User' && format('{0}', github.event.sender.id) == github.actor_id) ||
       (github.actor_id == '41898282' && inputs.release-pr != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      release-build-id: ${{ steps.release-build-id-generator.outputs.release-build-id }}
      nightly-build-id: ${{ steps.nightly-build-id-generator.outputs.nightly-build-id }}
    steps:
      - name: Verify the requested release commit
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          if [[ -n "$EXPECTED_SHA" && "$GITHUB_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Expected $EXPECTED_SHA, but $GITHUB_REF was at $GITHUB_SHA when dispatched."
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false
      - name: Select the release commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.release-pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          commit="$GITHUB_SHA"
          if [[ -n "$RELEASE_PR" ]]; then
            if [[ ! "$RELEASE_PR" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Invalid release PR number: $RELEASE_PR"
              exit 1
            fi
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR" --jq '
              select(.merged and .head.repo.id == .base.repo.id and
                .user.login == "astral-releases-bot[bot]" and (.head.ref | startswith("release/auto/"))) |
              [.base.ref, .merge_commit_sha] | @tsv')
            IFS=$'\t' read -r base commit <<< "$pr"
            if [[ "$base" != "$DEFAULT_BRANCH" || -z "$commit" ]]; then
              echo "::error::PR #$RELEASE_PR must be an automated release merged into $DEFAULT_BRANCH."
              exit 1
            fi
            # The tag requires a successful release deployment for this exact commit.
            if [[ "$commit" != "$GITHUB_SHA" ]]; then
              echo "::error::PR #$RELEASE_PR merged at $commit, but $GITHUB_REF was at $GITHUB_SHA when Release was dispatched."
              exit 1
            fi
          fi
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.9"
          checksum: "a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5"
      - name: Validate release metadata
        id: metadata
        run: |
          if [[ -z "$VERSION" ]]; then
            VERSION="$(uv run --locked --only-group jaq jaq -er '.version' package.json)"
          fi
          uv run --locked scripts/release.py --validate "$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparing ${VERSION} from ${RELEASE_COMMIT}" >> "$GITHUB_STEP_SUMMARY"
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
          VERSION: ${{ inputs.version }}
      - name: Generate Build ID (release)
        if: steps.metadata.outputs.prerelease == 'false'
        id: release-build-id-generator
        run: |
          release_build_id="$(python -m build.generate_build_id)"
          echo "release-build-id: ${release_build_id}"
          echo "release-build-id=${release_build_id}" >> "$GITHUB_OUTPUT"
      - name: Generate Build ID (nightly)
        if: steps.metadata.outputs.prerelease == 'true'
        id: nightly-build-id-generator
        run: |
          nightly_build_id="$(python -m build.generate_build_id --pre-release)"
          echo "nightly-build-id: ${nightly_build_id}"
          echo "nightly-build-id=${nightly_build_id}" >> "$GITHUB_OUTPUT"

  # Phase 2: Build the extension on all platforms.
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            code-target: win32-x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            code-target: win32-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            code-target: linux-x64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            code-target: linux-arm64
            arch: aarch64
          - os: ubuntu-22.04
            target: arm-unknown-linux-gnueabihf
            code-target: linux-armhf
            arch: armv7
          - os: macos-latest
            target: x86_64-apple-darwin
            code-target: darwin-x64
          - os: macos-15
            target: aarch64-apple-darwin
            code-target: darwin-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            code-target: alpine-x64
            pip-platform: musllinux_1_2_x86_64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            code-target: alpine-arm64
            pip-platform: musllinux_1_2_aarch64

    name: Build (${{ matrix.target }})
    needs: ["validate-release"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - if: runner.os == 'macOS'
        uses: astral-sh/github-actions/demudhra@67dc9ee1ddc113eccd8116e7b949fb6cdcd89889 # 2026.11.16.0
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.commit }}
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false

      # Install Python dependencies (including Ruff's native binary).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      # ARM builds on macOS, which should select Ruff's universal binary.
      - run: arch -arm64 python -m pip install -t ./bundled/libs --implementation py --no-deps --upgrade -r ./requirements.txt
        if: ${{ startsWith(matrix.os, 'macos') && startsWith(matrix.target, 'aarch64') }}

      # x86_64 builds on macOS, which should select Ruff's x86_64 binary.
      - run: arch -x86_64 python -m pip install -t ./bundled/libs --implementation py --no-deps --upgrade -r ./requirements.txt
        if: ${{ startsWith(matrix.os, 'macos') && startsWith(matrix.target, 'x86_64') }}

      # ARM builds on Ubuntu, which should select Ruff's ARM binary.
      - uses: uraimo/run-on-arch-action@fa1f3e7de95534497266c7265950b5188355fbfb # v3.2.1
        if: ${{ startsWith(matrix.os, 'ubuntu') && !startsWith(matrix.target, 'x86_64') && !endsWith(matrix.target, 'musl') }}
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu20.04
          install: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip
            pip3 install -U pip
          run: |
            python3 -m pip install -t ./bundled/libs --implementation py --no-deps --upgrade -r ./requirements.txt

      # Alpine targets, which should select Ruff's musl binaries.
      - name: Install musl Python dependencies
        if: ${{ startsWith(matrix.os, 'ubuntu') && endsWith(matrix.target, 'musl') }}
        run: |
          python -m pip install \
            --target ./bundled/libs \
            --implementation py \
            --platform "${{ matrix.pip-platform }}" \
            --only-binary=:all: \
            --no-deps \
            --upgrade \
            --requirement ./requirements.txt

      # Every other architecture, which should defer to `pip` without any special treatment.
      - run: python -m pip install -t ./bundled/libs --implementation py --no-deps --upgrade -r ./requirements.txt
        if: ${{ !startsWith(matrix.os, 'macos')
          && !(startsWith(matrix.os, 'ubuntu') && !startsWith(matrix.target, 'x86_64') && !endsWith(matrix.target, 'musl'))
          && !(startsWith(matrix.os, 'ubuntu') && endsWith(matrix.target, 'musl')) }}

      # Install Node.
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          package-manager-cache: false

      # Install Node dependencies.
      - run: npm ci --ignore-scripts

      # Set the Build ID.
      - name: Set Build ID (release)
        if: needs.validate-release.outputs.prerelease == 'false'
        run: |
          python -m build.update_ext_version --build-id "${BUILD_ID}" --for-publishing
        env:
          BUILD_ID: ${{ needs.validate-release.outputs.release-build-id }}
      - name: Set Build ID (nightly)
        if: needs.validate-release.outputs.prerelease == 'true'
        run: |
          python -m build.update_ext_version --build-id "${BUILD_ID}" --for-publishing --pre-release
        env:
          BUILD_ID: ${{ needs.validate-release.outputs.nightly-build-id }}

      # Build the extension.
      - name: Package Extension (release)
        if: needs.validate-release.outputs.prerelease == 'false'
        run: npx vsce package -o "./dist/ruff-${{ matrix.code-target }}.vsix" --target ${{ matrix.code-target }}
      - name: Package Extension (nightly)
        if: needs.validate-release.outputs.prerelease == 'true'
        run: npx vsce package -o "./dist/ruff-${{ matrix.code-target }}.vsix" --target ${{ matrix.code-target }} --pre-release

      # Upload the extension.
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: ./dist

  # Phase 3: Approve the release after all platform builds succeed.
  release-gate:
    # The release environment protection rule looks up this job by name.
    name: release-gate
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release-gate
    permissions: {}
    steps:
      - run: echo "Release approved"

  # Phase 4: Publish the built extension to both marketplaces.
  publish-code-marketplace:
    name: "Publish (Code Marketplace)"
    needs: ["validate-release", "release-gate"]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install Nodejs
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          package-manager-cache: false

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.commit }}
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false

      # Download all built artifacts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-aarch64-apple-darwin
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-apple-darwin
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-aarch64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-arm-unknown-linux-gnueabihf
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-pc-windows-msvc
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-aarch64-pc-windows-msvc
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-unknown-linux-musl
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-aarch64-unknown-linux-musl
          path: dist
      - run: ls -al ./dist

      # Install the marketplace publishing tools.
      - run: npm ci --ignore-scripts
        working-directory: scripts/publish

      # Publish to the Code Marketplace.
      - name: Publish Extension (Code Marketplace, release)
        if: needs.validate-release.outputs.prerelease == 'false'
        run: ./scripts/publish/node_modules/.bin/vsce publish --oidc --packagePath ./dist/ruff-*.vsix --skip-duplicate
      - name: Publish Extension (Code Marketplace, nightly)
        if: needs.validate-release.outputs.prerelease == 'true'
        run: ./scripts/publish/node_modules/.bin/vsce publish --oidc --packagePath ./dist/ruff-*.vsix --pre-release --skip-duplicate

  publish-openvsx:
    name: "Publish (OpenVSX)"
    needs: ["validate-release", "release-gate"]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install Nodejs
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          package-manager-cache: false

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.commit }}
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false

      # Download all built artifacts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-aarch64-apple-darwin
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-apple-darwin
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-aarch64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-arm-unknown-linux-gnueabihf
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-pc-windows-msvc
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-aarch64-pc-windows-msvc
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-unknown-linux-musl
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-aarch64-unknown-linux-musl
          path: dist
      - run: ls -al ./dist

      # Install the marketplace publishing tools.
      - run: npm ci --ignore-scripts
        working-directory: scripts/publish

      # Publish to OpenVSX.
      - name: Publish Extension (OpenVSX, release)
        if: needs.validate-release.outputs.prerelease == 'false'
        run: ./scripts/publish/node_modules/.bin/ovsx publish --trusted-publishing --packagePath ./dist/ruff-*.vsix --skip-duplicate
        timeout-minutes: 2
      - name: Publish Extension (OpenVSX, nightly)
        if: needs.validate-release.outputs.prerelease == 'true'
        run: ./scripts/publish/node_modules/.bin/ovsx publish --trusted-publishing --packagePath ./dist/ruff-*.vsix --pre-release --skip-duplicate
        timeout-minutes: 2

  # Phase 5: Create the tag and GitHub release after both publications succeed.
  publish-github:
    name: Create GitHub release
    needs: ["validate-release", "publish-code-marketplace", "publish-openvsx"]
    permissions:
      id-token: write
    uses: $/.github/workflows/release-tag.yml
    with:
      version: ${{ needs.validate-release.outputs.version }}
      prerelease: ${{ needs.validate-release.outputs.prerelease == 'true' }}
    secrets:
      RELEASES_STS_API_URL: ${{ secrets.RELEASES_STS_API_URL }}
