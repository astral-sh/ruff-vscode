# Prepare the release PR, then publish from its merged commit in a second dispatch.
name: Release
run-name: ${{ inputs.prepare-only && format('Prepare ruff-vscode {0}', inputs.version) || inputs.ruff-version && format('Bundle Ruff {0}', inputs.ruff-version) || format('Publish ruff-vscode {0}', inputs.version) }}
on:
  workflow_dispatch:
    inputs:
      ruff-version:
        description: Upstream Ruff version to bundle (prepares and merges a stable release)
        required: false
        type: string
      version:
        description: Exact extension version to release, without a leading v
        required: false
        type: string
      prepare-only:
        description: Open a release PR for manual editing and merge (requires version)
        type: boolean
        default: false
      expected-sha:
        description: Expected main commit for publishing
        required: false
        type: string

concurrency:
  group: ${{ (inputs.prepare-only || inputs.ruff-version) && 'release-prepare' || 'release' }}
  queue: max
  cancel-in-progress: false

env:
  FETCH_DEPTH: 0

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare release PR
    if: github.repository == 'astral-sh/ruff-vscode' && github.ref == 'refs/heads/main' && (inputs.prepare-only || inputs.ruff-version != '')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write # Read CI results and dispatch the publisher.
      id-token: write # Exchange for the release PR token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.7"
          checksum: "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83"
          python-version: "3.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
          package-manager-cache: false

      - name: Select extension version
        id: bump
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected-sha }}
          PREPARE_ONLY: ${{ inputs.prepare-only }}
        run: |
          if [[ -n "$EXPECTED_SHA" ]]; then
            echo "::error::expected-sha is a publish input."
            exit 1
          fi
          if [[ "$PREPARE_ONLY" == true ]]; then
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Enter an exact extension version to prepare a release PR."
              exit 1
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "prepare=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$VERSION" ]]; then
            echo "::error::Pass ruff-version alone to prepare an upstream release."
            exit 1
          fi
          uv run --locked scripts/release.py --plan-upstream "$RUFF_VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump version and refresh lockfiles
        if: steps.bump.outputs.prepare == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          RUFF_VERSION: ${{ inputs.ruff-version }}
        run: |
          args=(--new-version "$VERSION")
          if [[ -n "$RUFF_VERSION" ]]; then
            args+=(--new-ruff "$RUFF_VERSION")
          fi
          uv run --locked scripts/release.py "${args[@]}"
          uv run --locked scripts/release.py --validate "$VERSION"

      - name: Get release PR token
        id: token
        if: steps.bump.outputs.prepare == 'true'
        uses: astral-sh/github-actions/simple-token-service@eb81cf4d13127c3f9539f621c17e4c65327636c8
        with:
          exchange-url: ${{ secrets.RELEASES_STS_API_URL }}/exchange
          audience: ${{ secrets.RELEASES_STS_API_URL }}
          repository: astral-sh/ruff-vscode
          permissions: |
            contents: write
            pull_requests: write

      - name: Create release PR
        id: pr
        if: steps.bump.outputs.prepare == 'true'
        uses: astral-sh/github-actions/create-release-pr@b18ab2e0c11d16711c1818c8774babfa0203b909 # 2026.10.08.0
        with:
          version: ${{ steps.bump.outputs.version }}
          token: ${{ steps.token.outputs.token }}

      - name: Wait for CI on the prepared commit
        if: steps.bump.outputs.prepare == 'true' && !inputs.prepare-only
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(git rev-parse HEAD)
          for workflow in ci.yml zizmor.yml; do
            endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs"
            while true; do
              state=$(gh api "$endpoint?head_sha=$head_sha&event=pull_request&per_page=1" \
                --jq '.workflow_runs[0] | .conclusion // .status // "waiting"')
              case "$state" in
                success) break ;;
                waiting|requested|queued|in_progress|pending) sleep 10 ;;
                *) echo "::error::$workflow finished with $state"; exit 1 ;;
              esac
            done
          done

      - name: Merge the tested commit
        id: merge
        if: steps.bump.outputs.prepare == 'true' && !inputs.prepare-only
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          pr_number=${PR_URL##*/}
          sha=$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$pr_number/merge" \
            -f merge_method=squash -f sha="$(git rev-parse HEAD)" --jq 'select(.merged) | .sha')
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch publication from main
        if: steps.bump.outputs.version != '' && !inputs.prepare-only
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          MERGE_SHA: ${{ steps.merge.outputs.sha || steps.bump.outputs.sha }}
        run: |
          gh workflow run release.yml --ref main -f version="$VERSION" -f expected-sha="$MERGE_SHA"

  # Phase 1: Validate the release and generate the Build ID.
  # We have to do this ahead-of-time, and store it as a job output,
  # to ensure that we use the same Build ID across all build jobs.
  validate-release:
    name: Validate release
    if: github.repository == 'astral-sh/ruff-vscode' && github.ref == 'refs/heads/main' && !inputs.prepare-only && inputs.ruff-version == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      release-build-id: ${{ steps.release-build-id-generator.outputs.release-build-id }}
      nightly-build-id: ${{ steps.nightly-build-id-generator.outputs.nightly-build-id }}
    steps:
      - name: Verify the requested release commit
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          if [[ -n "$EXPECTED_SHA" && "$GITHUB_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Expected $EXPECTED_SHA, but main was at $GITHUB_SHA when dispatched."
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.7"
          checksum: "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83"
      - name: Validate release metadata
        id: metadata
        run: |
          uv run --locked scripts/release.py --validate "$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparing ${VERSION} from ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ inputs.version }}
      - name: Generate Build ID (release)
        if: steps.metadata.outputs.prerelease == 'false'
        id: release-build-id-generator
        run: |
          release_build_id="$(python -m build.generate_build_id)"
          echo "release-build-id: ${release_build_id}"
          echo "release-build-id=${release_build_id}" >> "$GITHUB_OUTPUT"
      - name: Generate Build ID (nightly)
        if: steps.metadata.outputs.prerelease == 'true'
        id: nightly-build-id-generator
        run: |
          nightly_build_id="$(python -m build.generate_build_id --pre-release)"
          echo "nightly-build-id: ${nightly_build_id}"
          echo "nightly-build-id=${nightly_build_id}" >> "$GITHUB_OUTPUT"

  # Phase 2: Build the extension on all platforms.
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            code-target: win32-x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            code-target: win32-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            code-target: linux-x64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            code-target: linux-arm64
            arch: aarch64
          - os: ubuntu-22.04
            target: arm-unknown-linux-gnueabihf
            code-target: linux-armhf
            arch: armv7
          - os: macos-latest
            target: x86_64-apple-darwin
            code-target: darwin-x64
          - os: macos-15
            target: aarch64-apple-darwin
            code-target: darwin-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            code-target: alpine-x64
            pip-platform: musllinux_1_2_x86_64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            code-target: alpine-arm64
            pip-platform: musllinux_1_2_aarch64

    name: Build (${{ matrix.target }})
    needs: ["validate-release"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - if: runner.os == 'macOS'
        uses: astral-sh/github-actions/demudhra@7aa50a3def9f5428c532b0ae972d1e5b357de5a5 # 2026.11.03.0
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false

      # Install Python dependencies (including Ruff's native binary).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      # ARM builds on macOS, which should select Ruff's universal binary.
      - run: arch -arm64 python -m pip install -t ./bundled/libs --implementation py --no-deps --upgrade -r ./requirements.txt
        if: ${{ startsWith(matrix.os, 'macos') && startsWith(matrix.target, 'aarch64') }}

      # x86_64 builds on macOS, which should select Ruff's x86_64 binary.
      - run: arch -x86_64 python -m pip install -t ./bundled/libs --implementation py --no-deps --upgrade -r ./requirements.txt
        if: ${{ startsWith(matrix.os, 'macos') && startsWith(matrix.target, 'x86_64') }}

      # ARM builds on Ubuntu, which should select Ruff's ARM binary.
      - uses: uraimo/run-on-arch-action@fa1f3e7de95534497266c7265950b5188355fbfb # v3.2.1
        if: ${{ startsWith(matrix.os, 'ubuntu') && !startsWith(matrix.target, 'x86_64') && !endsWith(matrix.target, 'musl') }}
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu20.04
          install: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip
            pip3 install -U pip
          run: |
            python3 -m pip install -t ./bundled/libs --implementation py --no-deps --upgrade -r ./requirements.txt

      # Alpine targets, which should select Ruff's musl binaries.
      - name: Install musl Python dependencies
        if: ${{ startsWith(matrix.os, 'ubuntu') && endsWith(matrix.target, 'musl') }}
        run: |
          python -m pip install \
            --target ./bundled/libs \
            --implementation py \
            --platform "${{ matrix.pip-platform }}" \
            --only-binary=:all: \
            --no-deps \
            --upgrade \
            --requirement ./requirements.txt

      # Every other architecture, which should defer to `pip` without any special treatment.
      - run: python -m pip install -t ./bundled/libs --implementation py --no-deps --upgrade -r ./requirements.txt
        if: ${{ !startsWith(matrix.os, 'macos')
          && !(startsWith(matrix.os, 'ubuntu') && !startsWith(matrix.target, 'x86_64') && !endsWith(matrix.target, 'musl'))
          && !(startsWith(matrix.os, 'ubuntu') && endsWith(matrix.target, 'musl')) }}

      # Install Node.
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
          package-manager-cache: false

      # Install Node dependencies.
      - run: npm ci --ignore-scripts

      # Set the Build ID.
      - name: Set Build ID (release)
        if: needs.validate-release.outputs.prerelease == 'false'
        run: |
          python -m build.update_ext_version --build-id "${BUILD_ID}" --for-publishing
        env:
          BUILD_ID: ${{ needs.validate-release.outputs.release-build-id }}
      - name: Set Build ID (nightly)
        if: needs.validate-release.outputs.prerelease == 'true'
        run: |
          python -m build.update_ext_version --build-id "${BUILD_ID}" --for-publishing --pre-release
        env:
          BUILD_ID: ${{ needs.validate-release.outputs.nightly-build-id }}

      # Build the extension.
      - name: Package Extension (release)
        if: needs.validate-release.outputs.prerelease == 'false'
        run: npx vsce package -o "./dist/ruff-${{ matrix.code-target }}.vsix" --target ${{ matrix.code-target }}
      - name: Package Extension (nightly)
        if: needs.validate-release.outputs.prerelease == 'true'
        run: npx vsce package -o "./dist/ruff-${{ matrix.code-target }}.vsix" --target ${{ matrix.code-target }} --pre-release

      # Upload the extension.
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: ./dist

  # Phase 3: Approve the release after all platform builds succeed.
  release-gate:
    # N.B. This name should not change; the release environment gate relies on it.
    name: release-gate
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release-gate
    permissions: {}
    steps:
      - run: echo "Release approved"

  # Phase 4: Publish the built extension to both marketplaces.
  publish-code-marketplace:
    name: "Publish (Code Marketplace)"
    needs: ["validate-release", "release-gate"]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install Nodejs
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
          package-manager-cache: false

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false

      # Download all built artifacts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-aarch64-apple-darwin
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-apple-darwin
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-aarch64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-arm-unknown-linux-gnueabihf
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-pc-windows-msvc
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-aarch64-pc-windows-msvc
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-unknown-linux-musl
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-aarch64-unknown-linux-musl
          path: dist
      - run: ls -al ./dist

      # Install the marketplace publishing tools.
      - run: npm ci --ignore-scripts
        working-directory: scripts/publish

      # Publish to the Code Marketplace.
      - name: Publish Extension (Code Marketplace, release)
        if: needs.validate-release.outputs.prerelease == 'false'
        run: ./scripts/publish/node_modules/.bin/vsce publish --oidc --packagePath ./dist/ruff-*.vsix --skip-duplicate
      - name: Publish Extension (Code Marketplace, nightly)
        if: needs.validate-release.outputs.prerelease == 'true'
        run: ./scripts/publish/node_modules/.bin/vsce publish --oidc --packagePath ./dist/ruff-*.vsix --pre-release --skip-duplicate

  publish-openvsx:
    name: "Publish (OpenVSX)"
    needs: ["validate-release", "release-gate"]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install Nodejs
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
          package-manager-cache: false

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false

      # Download all built artifacts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-aarch64-apple-darwin
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-apple-darwin
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-aarch64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-arm-unknown-linux-gnueabihf
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-pc-windows-msvc
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-aarch64-pc-windows-msvc
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-unknown-linux-musl
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-aarch64-unknown-linux-musl
          path: dist
      - run: ls -al ./dist

      # Install the marketplace publishing tools.
      - run: npm ci --ignore-scripts
        working-directory: scripts/publish

      # Publish to OpenVSX.
      - name: Publish Extension (OpenVSX, release)
        if: needs.validate-release.outputs.prerelease == 'false'
        run: ./scripts/publish/node_modules/.bin/ovsx publish --trusted-publishing --packagePath ./dist/ruff-*.vsix --skip-duplicate
        timeout-minutes: 2
      - name: Publish Extension (OpenVSX, nightly)
        if: needs.validate-release.outputs.prerelease == 'true'
        run: ./scripts/publish/node_modules/.bin/ovsx publish --trusted-publishing --packagePath ./dist/ruff-*.vsix --pre-release --skip-duplicate
        timeout-minutes: 2

  # Phase 5: Create the tag and GitHub release after both publications succeed.
  publish-github:
    name: Create GitHub release
    needs: ["validate-release", "publish-code-marketplace", "publish-openvsx"]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release and tag
        run: |
          prerelease=()
          if [[ "$PRERELEASE" == "true" ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "$VERSION" \
            --generate-notes \
            "${prerelease[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.validate-release.outputs.prerelease }}
          RELEASE_COMMIT: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
