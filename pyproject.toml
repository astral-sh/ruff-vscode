[project]
name = "ruff-vscode"
version = "2026.72.0"
requires-python = ">=3.8"
dependencies = ["packaging>=23.1", "ruff-lsp==0.0.62", "ruff==0.16.3"]

[tool.uv]
exclude-newer = "P7D"
# Release automation intentionally tracks the latest Ruff and ruff-lsp.
exclude-newer-package = { ruff = false, ruff-lsp = false }
# ruff-lsp 0.0.62 imports APIs that were removed in newer releases.
constraint-dependencies = ["lsprotocol==2023.0.1", "pygls==1.3.1"]

[tool.ruff]
line-length = 88
target-version = "py38"
extend-exclude = ["bundled/libs", "src/testFixture"]

[tool.ruff.lint]
select = ["E", "F", "W", "Q", "UP", "I", "N"]

[tool.ty.analysis]
allowed-unresolved-imports = ["debugpy"]

[dependency-groups]
dev = [
    "python-lsp-jsonrpc==1.0.0",
    "ruff>=0.16.2",
    "ty>=0.0.69",
    "uv>=0.12.3",
]
