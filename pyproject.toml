[project]
name = "ruff-vscode"
version = "2026.88.0"
requires-python = ">=3.8"
dependencies = ["ruff==0.17.1"]

[tool.uv]
exclude-newer = "P7D"
# Release automation intentionally tracks the latest Ruff.
exclude-newer-package = { ruff = false, uv = false }

[tool.ruff]
line-length = 88
target-version = "py38"
extend-exclude = ["bundled/libs", "src/testFixture"]

[tool.ruff.lint]
select = ["E", "F", "W", "Q", "UP", "I", "N"]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "ty>=0.0.69",
    "uv>=0.12.3",
]
