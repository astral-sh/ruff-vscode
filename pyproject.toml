[project]
name = "ruff-vscode"
version = "2026.88.0"
requires-python = ">=3.8"
dependencies = ["ruff==0.17.1"]

[tool.uv]
exclude-newer = "P7D"
# Release automation intentionally tracks the latest Ruff.
#
# Allow uv 0.13.4 before the seven-day wait: it removes trust in the eMudhra
# root that signed the compromised intermediate certificates.
exclude-newer-package = { ruff = false, uv = "2026-10-20T15:12:07Z" }

[tool.ruff]
line-length = 88
target-version = "py38"
extend-exclude = ["bundled/libs", "src/testFixture"]

[tool.ruff.lint]
select = ["E", "F", "W", "Q", "UP", "I", "N"]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "ty>=0.0.69",
    "uv>=0.13.4",
]
